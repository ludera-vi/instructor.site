upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name ivan-gunichev.ru www.ivan-gunichev.ru;
    return 301 https://ivan-gunichev.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ivan-gunichev.ru;

    ssl_certificate     /etc/letsencrypt/live/ivan-gunichev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivan-gunichev.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ivan-gunichev.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ivan-gunichev.ru;

    ssl_certificate     /etc/letsencrypt/live/ivan-gunichev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivan-gunichev.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml
        font/woff font/woff2;

    location /static/ {
        alias /home/django/site/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /media/ {
        alias /home/django/site/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        add_header         Cache-Control "no-cache";
    }
}
