<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Фон — тёмный круг -->
  <circle cx="32" cy="32" r="32" fill="#0f0f1e"/>
  <!-- Внешнее кольцо руля -->
  <circle cx="32" cy="32" r="22" stroke="#4ecdc4" stroke-width="4" fill="none"/>
  <!-- Спицы руля — 3 штуки под 120° -->
  <line x1="32" y1="10" x2="32" y2="32" stroke="#4ecdc4" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="13.9" y2="43" stroke="#4ecdc4" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="50.1" y2="43" stroke="#4ecdc4" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Центральная втулка -->
  <circle cx="32" cy="32" r="5" fill="#4ecdc4"/>
</svg>
